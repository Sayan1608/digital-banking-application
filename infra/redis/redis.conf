# ── dbank Redis config ────────────────────────────────────
# Password is injected on the command line from .env, not stored here.

bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Durability: AOF everysec + RDB snapshots. Idempotency keys and
# in-flight transfer locks must survive a broker restart.
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Never evict: silently dropping an idempotency key can double-post a payment.
maxmemory 512mb
maxmemory-policy noeviction

# Keyspace notifications for expiring locks/sessions (Kg = generic + expired)
notify-keyspace-events "Kgx"

databases 16
loglevel notice
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

# Block the footguns outright in a financial environment.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
